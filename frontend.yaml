apiVersion: apps/v1
kind: Deployment

metadata:
  name: movie-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: movie-frontend

  template:
    metadata:
      labels:
        app: movie-frontend

    spec:
      containers:
      - name: frontend
        image: monicacontainerregistry123.azurecr.io/movie-frontend:1.0
        
        ports:
        - containerPort: 80
