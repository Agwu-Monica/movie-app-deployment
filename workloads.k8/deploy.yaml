apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-v1
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-app
      version: v1
  template:
    metadata:
      labels:
        app: nginx-app
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        
        
        
        